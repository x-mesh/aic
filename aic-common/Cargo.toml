[package]
name = "aic-common"
version = "0.42.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
build = "build.rs"

[features]
# Phase lock: 정확히 하나의 phase-3_N만 활성이어야 한다 (build.rs에서 assert).
# 기본값은 phase-3_4 (공식 릴리스와 동일 — Central_Store_Flag default = true).
# 다른 Phase를 선택할 때는 `cargo build --no-default-features --features phase-3_2` 형태로 지정.
default = ["phase-3_4"]
phase-3_1 = []
phase-3_2 = []
phase-3_3 = []
phase-3_4 = []
phase-3_5 = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
libc = "0.2"
sha2 = "=0.10.9"
rand = "0.8"
# secret·PII redaction(redaction.rs) 패턴 매칭. aic-client에서 옮겨오며 함께 이동 —
# aic-server(OTLP exporter)도 동일 redaction을 공유한다.
regex = "1"
tracing = "0.1"
# Attach frame 프로토콜 (aic-common/src/attach.rs) 에서 raw PTY byte slice 를
# 소유권 이전 없이 전달하기 위해 사용한다. serde feature 는 의도적으로 끄고,
# PtyBytes 는 JSON 경로를 거치지 않고 전용 binary wire path 로만 전송된다.
bytes = "1"
# Attach frame async read/write helper 를 위해 필요. tokio 의 io trait 만
# 사용하므로 feature 를 `io-util` 로 최소화한다. aic-server 는 "full" 로 가져가지만
# aic-common 은 lean 하게 유지한다.
# `sync` 는 BoundedByteChannel 이 사용하는 `tokio::sync::mpsc::unbounded_channel` 때문에 필요하다.
tokio = { version = "1", features = ["io-util", "rt", "sync", "time"] }
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "linux-native", "windows-native"] }
rustls = { version = "=0.23.39", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.4"
tokio-postgres = { version = "=0.7.15", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["ring"] }
mysql_async = { version = "=0.37.1", default-features = false, features = ["default-rustls-ring"] }
mongodb = { version = "=3.9.1", default-features = false, features = ["compat-3-0-0", "bson-2", "openssl-tls", "redact-errors"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
csv = { version = "=1.4.0", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# MongoDB uses OpenSSL TLS. Release binaries use one static OpenSSL implementation on Linux
# and macOS so cross-builds do not depend on a host Homebrew library.
openssl = { version = "=0.10.81", default-features = false, features = ["vendored"] }

[dev-dependencies]
proptest = "1"
tokio-test = "0.4"
toml = "0.8"
# 단위 테스트에서 write_attach_frame → read_attach_frame round-trip 및
# BoundedByteChannel 동시성 테스트를 위해 필요.
# - `macros`: `#[tokio::test]`
# - `rt` / `rt-multi-thread`: 싱글/멀티 스레드 tokio 런타임 (동시성 100k 검증)
# - `sync`: mpsc, Notify 등 동기화 primitive
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "sync"] }
