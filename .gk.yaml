# .gk.yaml — gk 프로젝트 설정 (팀 공유)
base_branch: main
branch:
    protected:
        - main
        - develop
    patterns:
        - ^(feat|fix|chore|docs|refactor|test|perf|build|ci|revert)/[a-z0-9._-]+
commit:
    types: [feat, fix, chore, docs, style, refactor, perf, test, build, ci, revert]
    scope_required: false
    max_subject_length: 72
preflight:
    steps:
        - name: commit-lint
          command: commit-lint
        - name: branch-check
          command: branch-check
        - name: no-conflict
          command: no-conflict
        - name: test
          command: make test
        - name: lint
          command: make lint
ai:
    commit:
        deny_paths:
            - .env
            - .env.*
            - '*.pem'
            - id_rsa*
            - credentials.json
        trailer: false
        audit: false
# ship 섹션은 의도적으로 비워 둔다. 이 저장소는 `git-kit ship`으로 릴리스하지 않는다.
# 릴리스 커밋은 Cargo.toml 3개 외에 Cargo.lock과 fuzz/Cargo.lock까지 함께 올려야 하는데
# (CI의 fuzz job이 --locked로 검증한다), ship의 version_files는 단일 version 줄만 바꾸므로
# lockfile을 표현하지 못한다. v0.42.3에서 이 불일치로 main/develop CI가 깨졌다.
# 절차는 RELEASING.md, 버전 bump는 `make bump-version` / `make tag`를 쓴다.

