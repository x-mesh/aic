name: release

# `v*` 태그 push 시 4 OS/arch 바이너리 빌드 + GitHub Release + x-mesh/homebrew-tap
# Formula 갱신까지 처리한다.
#
# **왜 GoReleaser가 아니라 커스텀 스크립트인가**: aic는 Rust + sysinfo(IOKit/CoreFoundation)·
# keyring(Security)이라 darwin 빌드가 macOS 프레임워크를 C 링커로 링크해야 한다. GoReleaser
# rust builder는 tool과 무관하게 항상 cargo-zigbuild(zig 링커)를 쓰는데, zig는 SDKROOT·
# `-L framework=` search path를 줘도 macOS 프레임워크를 못 링크해 v0.27.0부터 5번 실패했다
# (undefined symbol: _SecKeychain*/_IOBSDNameMatching). prebuilt builder는 GoReleaser Pro
# 전용이라 OSS로 불가. 검증된 유일한 길은 native cargo build(Apple ld가 프레임워크 링크)라,
# GoReleaser를 걷어내고 macos runner에서 직접 빌드·아카이브·릴리스·Formula 갱신을 한다.
# (x-mesh/gk는 Go(CGO off) 순수 크로스컴파일이라 이 문제가 없어 GoReleaser로 충분하다 —
# 언어가 달라 aic엔 그 패턴을 못 쓴다.)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # GitHub Release 생성

jobs:
  # target 4개를 동시에 빌드한다. 한 runner에서 차례로 빌드하면 target마다 7~17분이 그대로 더해져
  # 릴리스가 35~60분 걸렸다(v0.50.1~v0.50.4 실측). target끼리는 서로 독립이다.
  #
  # 모든 target을 macOS runner에서 빌드한다. darwin은 Apple SDK/ld가 있어야 프레임워크가 링크되고,
  # linux는 검증된 zig(macOS용 tarball + sha256 pin) + cargo-zigbuild 경로를 그대로 쓴다 — linux
  # runner로 옮기면 zig의 linux tarball pin과 새 빌드 경로를 따로 검증해야 한다.
  #
  # 예전의 `actions/cache`는 뺐다. 키가 `Cargo.lock` 해시라 버전 bump마다 빗나갔고, 대체 키로
  # main의 debug CI 캐시(~900MB)를 받아 왔을 뿐 release 빌드는 매번 전부 다시 컴파일했다
  # (v0.50.4: Compiling 1,355회). 복원·저장에 릴리스마다 1.5~2분만 들었다.
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { triple: x86_64-unknown-linux-gnu,  os: linux,  arch: amd64, tool: zig }
          - { triple: aarch64-unknown-linux-gnu, os: linux,  arch: arm64, tool: zig }
          - { triple: x86_64-apple-darwin,       os: darwin, arch: amd64, tool: native }
          - { triple: aarch64-apple-darwin,      os: darwin, arch: arm64, tool: native }
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      # zig + cargo-zigbuild — linux target 전용(darwin은 native cargo).
      # 이 pin은 `dtolnay/rust-toolchain@stable`과 짝을 이룬다. rustc가 새 링커 인자를
      # 넘기기 시작하면 낡은 zig가 그것을 거부해 릴리스가 통째로 실패한다 — 실제로
      # rustc 1.98이 aarch64-linux에 `--fix-cortex-a53-843419`를 넘기면서 zig 0.13.0 +
      # cargo-zigbuild 0.20.1 조합이 `unsupported linker arg`로 죽었다(v0.36.0 실측).
      # stable이 올라가면 이 두 pin도 함께 올려야 한다.
      #
      # **왜 mlugg/setup-zig action이 아닌가**: 그 action은 최신(v2.2.1)까지도
      # `using: node20`이라 GitHub이 Node 20을 걷어내면 릴리스가 통째로 멈춘다
      # (지금은 node24로 강제 실행되며 deprecation 경고가 매 릴리스마다 뜬다).
      # 직접 내려받으면 Actions 런타임에 묶이지 않고 tarball checksum까지 고정된다.
      # zig 버전을 올릴 때는 아래 두 sha256도 ziglang.org/download/index.json에서
      # 함께 갱신해야 한다 — 불일치면 이 step이 즉시 실패한다(조용한 오설치 방지).
      - name: Install zig
        if: matrix.tool == 'zig'
        env:
          ZIG_VERSION: "0.16.0"
          ZIG_SHA256_AARCH64: "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"
          ZIG_SHA256_X86_64: "0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7"
        run: |
          set -euxo pipefail
          case "$(uname -m)" in
            arm64|aarch64) zig_arch=aarch64; zig_sha="${ZIG_SHA256_AARCH64}" ;;
            x86_64)        zig_arch=x86_64;  zig_sha="${ZIG_SHA256_X86_64}" ;;
            *) echo "unsupported runner arch: $(uname -m)" >&2; exit 1 ;;
          esac
          name="zig-${zig_arch}-macos-${ZIG_VERSION}"
          cd "${RUNNER_TEMP}"
          curl -fsSL --retry 3 --retry-delay 5 -o "${name}.tar.xz" \
            "https://ziglang.org/download/${ZIG_VERSION}/${name}.tar.xz"
          echo "${zig_sha}  ${name}.tar.xz" | shasum -a 256 -c -
          tar -xJf "${name}.tar.xz"
          echo "${RUNNER_TEMP}/${name}" >> "$GITHUB_PATH"

      - name: Verify zig
        if: matrix.tool == 'zig'
        run: zig version

      # 폴백 없이 핀만 쓴다. 예전의 `|| cargo install --locked cargo-zigbuild`는
      # 핀 설치가 깨졌을 때 미검증 최신 버전을 조용히 깔아, 위 주석이 경고하는
      # `unsupported linker arg` 류 실패를 릴리스 한복판으로 옮겨놓을 뿐이었다.
      - name: Install cargo-zigbuild
        if: matrix.tool == 'zig'
        run: cargo install --locked cargo-zigbuild --version 0.23.0

      # 3 binary 빌드 → (os,arch) tar.gz. feature/package 인자는 이전 .goreleaser.yaml의 flags와
      # 동일(phase-3_4 릴리스 빌드). 태그가 아닌 ref(브랜치에서 workflow_dispatch)는 빌드만 하는
      # dry-run이라 버전에 `-dryrun`을 붙인다 — 브랜치 이름의 `/`가 파일명에 들어가지 않게 한다.
      - name: Build and archive
        run: |
          set -euxo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -m1 '^version' aic-client/Cargo.toml | cut -d'"' -f2)-dryrun"
          fi
          triple="${{ matrix.triple }}"
          if [ "${{ matrix.tool }}" = "zig" ]; then
            cargo zigbuild --release --target "$triple" --no-default-features --features phase-3_4 \
              -p aic-client --bin aic \
              -p aic-server --bin aic-session --bin aicd
          else
            cargo build --release --target "$triple" --no-default-features --features phase-3_4 \
              -p aic-client --bin aic \
              -p aic-server --bin aic-session --bin aicd
          fi
          stage="stage/${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p "$stage" dist
          cp "target/${triple}/release/aic" \
             "target/${triple}/release/aic-session" \
             "target/${triple}/release/aicd" \
             "$stage/"
          cp LICENSE* README.md CHANGELOG.md "$stage/" 2>/dev/null || true
          tar -C "$stage" -czf "dist/aic_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" .
          ls -la dist

      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.os }}_${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # 네 target이 모두 성공해야만 게시한다(`needs` + fail-fast). 태그 push(또는 태그 ref로 수동
  # 재실행)에서만 돈다 — 브랜치에서 workflow_dispatch하면 build까지만 도는 dry-run이 된다.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # tag 메타데이터 + 전체 git log

      - uses: actions/download-artifact@v6
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksum
        run: |
          set -euxo pipefail
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          [ "$(ls dist/*.tar.gz | wc -l)" -eq 4 ]
          ( cd dist && shasum -a 256 *.tar.gz > checksums.txt )
          ls -la dist
          cat dist/checksums.txt

      # GitHub Release — 이 repo에 직접 생성. mode:replace 멱등(재실행 시 asset 덮어쓰기).
      #   노트는 CHANGELOG의 해당 버전 섹션에서 뽑는다(tag 메시지보다 정보가 많다).
      - name: Create/refresh GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[?v?"ver"\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "aic ${VERSION}" > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "$TAG" dist/*.tar.gz dist/checksums.txt \
              --title "$TAG" --notes-file release-notes.md
          fi

      # x-mesh/homebrew-tap Formula 갱신 — GoReleaser brews가 하던 것을 재현.
      #   os/arch별 sha256을 checksums에서 뽑아 기존 Formula 형식(on_macos/on_linux ×
      #   intel/arm, url+sha256+install)을 그대로 재생성 후 push한다.
      #   url은 이 repo(x-mesh/aic)의 release를 직접 가리킨다 — public이라 미인증
      #   다운로드가 그대로 되므로 미러가 필요 없다.
      - name: Update Homebrew tap Formula
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          sha() { grep "aic_${VERSION}_$1.tar.gz" dist/checksums.txt | awk '{print $1}'; }
          DA="$(sha darwin_amd64)"; DR="$(sha darwin_arm64)"
          LA="$(sha linux_amd64)";  LR="$(sha linux_arm64)"

          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/x-mesh/homebrew-tap.git" tap

          cat > tap/Formula/aic.rb <<RUBY
          # typed: false
          # frozen_string_literal: true

          # This file is generated by aic's release workflow. DO NOT EDIT.
          class Aic < Formula
            desc "Shell command error analyzer with LLM (PTY wrapper + supervisor daemon)"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.intel?
                url "${base}/aic_${VERSION}_darwin_amd64.tar.gz"
                sha256 "${DA}"

                def install
                  bin.install "aic"
                  bin.install "aic-session"
                  bin.install "aicd"
                end
              end
              if Hardware::CPU.arm?
                url "${base}/aic_${VERSION}_darwin_arm64.tar.gz"
                sha256 "${DR}"

                def install
                  bin.install "aic"
                  bin.install "aic-session"
                  bin.install "aicd"
                end
              end
            end

            on_linux do
              if Hardware::CPU.intel? && Hardware::CPU.is_64_bit?
                url "${base}/aic_${VERSION}_linux_amd64.tar.gz"
                sha256 "${LA}"

                def install
                  bin.install "aic"
                  bin.install "aic-session"
                  bin.install "aicd"
                end
              end
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "${base}/aic_${VERSION}_linux_arm64.tar.gz"
                sha256 "${LR}"

                def install
                  bin.install "aic"
                  bin.install "aic-session"
                  bin.install "aicd"
                end
              end
            end

            def caveats
              <<~EOS
                To run aicd in the background and on login:

                  aic daemon install        # writes the right unit for your OS

                First-time setup:
                  aic config                # interactive provider/api_key/model wizard
                  aic init zsh              # add 'source ~/.aic/hooks.zsh' to your rc
              EOS
            end

            test do
              system "#{bin}/aic", "--version"
              system "#{bin}/aic-session", "--version"
              system "#{bin}/aicd", "--version"
            end
          end
          RUBY

          cd tap
          git config user.name "aic-bot"
          git config user.email "bot@x-mesh.dev"
          git add Formula/aic.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged"
          else
            git commit -m "aic ${VERSION}"
            git push
          fi
