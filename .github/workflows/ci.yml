name: CI

# main에서는 돌지 않는다. main은 CI를 통과한 develop 커밋의 fast-forward로만 갱신되고(RELEASING.md),
# 릴리스는 같은 커밋의 develop CI를 태그 게이트로 쓴다. main까지 돌리면 같은 SHA에 14개 job이 두 벌
# 뜨고 macOS runner를 서로 기다려 태그 전 대기가 11~16분으로 늘었다(v0.50.3~v0.50.5 실측).
on:
  push:
    branches: [develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # CI 빌드 산출물을 줄인다. ubuntu test job의 target 캐시가 개당 ~2.8GB(최대 5.1GB)라 저장소 캐시
  # 한도(10GB)에서 서로 밀어내고, 복원·저장에만 job당 2~5분이 들었다. 줄 번호는 남겨 실패 backtrace는
  # 그대로 읽힌다. incremental 데이터는 새 runner에서 재사용되지 않으므로 만들지 않는다.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"
  # ubuntu job이 빌드 전에 확보할 여유 디스크. cold 빌드 뒤 target이 ~5.6GB였다(PR #49 실측).
  MIN_FREE_DISK_GB: "20"

jobs:
  fuzz-smoke:
    name: fuzz smoke (JVM PerfData parser)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-09-01

      - name: Cache fuzz tool and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: linux-fuzz-nightly-2026-09-01-cargo-fuzz-0.13.2-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: |
            linux-fuzz-nightly-2026-09-01-cargo-fuzz-0.13.2-

      - name: Install cargo-fuzz
        run: |
          if [ "$(cargo fuzz --version 2>/dev/null || true)" != "cargo-fuzz 0.13.2" ]; then
            cargo install cargo-fuzz --version 0.13.2 --locked --force
          fi

      - name: Verify fuzz lockfile and corpus
        run: |
          cargo +nightly-2026-09-01 metadata \
            --manifest-path fuzz/Cargo.toml --locked --format-version 1 >/dev/null
          python3 fuzz/scripts/check_corpus.py

      - name: Build parser fuzz target
        run: cargo +nightly-2026-09-01 fuzz build jvm_perfdata

      - name: Run bounded parser fuzz smoke
        run: |
          mkdir -p fuzz/artifacts/jvm_perfdata
          timeout 120s cargo +nightly-2026-09-01 fuzz run \
            jvm_perfdata fuzz/corpus/jvm_perfdata -- \
            -runs=1000 \
            -max_len=1048576 \
            -timeout=1 \
            -rss_limit_mb=2048 \
            -artifact_prefix=fuzz/artifacts/jvm_perfdata/

      - name: Upload fuzz failures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: jvm-perfdata-fuzz-artifacts
          path: fuzz/artifacts/jvm_perfdata/
          if-no-files-found: ignore
          retention-days: 7

  # Clippy 는 default feature (phase-3_4) 로 한 번만 돈다. 모든 Phase 에서 공통으로
  # 유지되는 lint 규칙만 검사하기 때문에 phase × os × central_store 매트릭스로 부풀
  # 필요는 없다. 아래 test job 과 분리해 실패 원인을 빨리 식별하기 쉽게 한다.
  check:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      # ubuntu 러너 디스크 고갈 방지(test 잡과 같은 이유).
      - name: Free disk space (ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          avail=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          if [ "$avail" -lt "$MIN_FREE_DISK_GB" ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          fi
          df -h /

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Clippy lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Phase 3.3 / 3.4 의 test matrix. AIC_CENTRAL_STORE env 를 "0" / "1" 양쪽에서
  # 돌려 Central_Store_Flag on/off 회귀를 모두 커버한다 (R18.1, R18.2).
  #
  # NOTE: aic-common/build.rs 는 정확히 하나의 phase-3_N feature 만 활성임을
  # 빌드 시점에 assert 한다. workspace default 가 phase-3_4 이기 때문에 다른
  # Phase 를 테스트할 때는 `--no-default-features` 를 반드시 붙여야 한다.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.phase }}, central_store=${{ matrix.central_store }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        phase: [phase-3_3, phase-3_4]
        central_store: ["0", "1"]
    env:
      AIC_CENTRAL_STORE: ${{ matrix.central_store }}

    steps:
      - uses: actions/checkout@v6

      # ubuntu 러너 여유 디스크가 ~14GB이던 때 cargo 캐시 + workspace 전체 debug 빌드가 디스크를 채워
      # "No space left on device"로 죽었다(v0.34.0 게이트에서 2회 연속 실측). 지금 러너는 여유가 훨씬
      # 크지만 삭제에 job마다 1~7분이 들었으므로, 여유가 MIN_FREE_DISK_GB 미만일 때만 프리인스톨 대형
      # 툴체인을 걷어낸다. macos 러너는 여유가 커서 불필요.
      - name: Free disk space (ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          avail=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          if [ "$avail" -lt "$MIN_FREE_DISK_GB" ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          fi
          df -h /

      - uses: dtolnay/rust-toolchain@stable

      # 캐시 키용 의존성 해시. Cargo.lock에서 워크스페이스(aic-*) 항목을 뺀다 — 릴리스 bump는 버전 줄만
      # 바꾸는데 파일 전체 해시를 키로 쓰면 릴리스 게이트 run마다 새 키가 되어 ~3GB를 다시 저장했다.
      - name: Dependency hash
        id: deps
        shell: bash
        run: echo "hash=$(sed '/^name = "aic-/,/^$/d' Cargo.lock | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # 복원만 여기서 하고 저장은 아래에서 조건부로 한다. `v2`는 debuginfo 설정을 바꾸기 전의 큰 캐시를
      # 받지 않기 위한 세대 표시다.
      - name: Restore cargo cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-v2-${{ matrix.phase }}-${{ steps.deps.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-${{ matrix.phase }}-

      - name: Run tests
        run: cargo test --workspace --no-default-features --features ${{ matrix.phase }}

      - name: Report disk usage
        if: always()
        shell: bash
        run: |
          du -sh target ~/.cargo/registry 2>/dev/null || true
          df -h . | tail -1

      # 저장은 develop push에서, 같은 키를 쓰는 central_store 0/1 중 한 job만 한다. 두 job이 같은 키를
      # 동시에 저장하려 하면 한쪽은 "Unable to reserve cache"로 실패하면서도 압축에 1분 넘게 썼다. PR에서
      # 저장한 캐시는 그 PR에서만 읽혀 한도만 잠식하므로 저장하지 않는다(PR은 develop 캐시를 읽는다).
      - name: Save cargo cache
        if: github.event_name == 'push' && matrix.central_store == '0' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # Phase 3.5 는 세션 로컬 data plane 이 제거된 빌드이므로 AIC_CENTRAL_STORE=0
  # 조합이 의미를 잃는다 (R19.3). 따라서 central_store 매트릭스 없이 단일
  # 변형만 돌린다. env 는 명시적으로 "1" 로 고정해 의도를 남긴다.
  test-phase-3_5:
    name: test phase-3_5 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      AIC_CENTRAL_STORE: "1"

    steps:
      - uses: actions/checkout@v6

      # test job과 동일한 이유(ubuntu 러너 디스크 고갈 방지).
      - name: Free disk space (ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          avail=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          if [ "$avail" -lt "$MIN_FREE_DISK_GB" ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          fi
          df -h /

      - uses: dtolnay/rust-toolchain@stable

      # test job과 같은 이유(릴리스 bump가 캐시 키를 바꾸지 않게).
      - name: Dependency hash
        id: deps
        shell: bash
        run: echo "hash=$(sed '/^name = "aic-/,/^$/d' Cargo.lock | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore cargo cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-v2-phase-3_5-${{ steps.deps.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-phase-3_5-

      - name: Run tests
        run: cargo test --workspace --no-default-features --features phase-3_5

      - name: Report disk usage
        if: always()
        shell: bash
        run: |
          du -sh target ~/.cargo/registry 2>/dev/null || true
          df -h . | tail -1

      # test job과 같은 이유로 develop push에서만 저장한다(이 job은 central_store 변형이 하나다).
      - name: Save cargo cache
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # SRE R6: headless(비대화·TTY 없음) 안전성 게이트. aic는 서버(cron/systemd/webhook
  # spawn)에서 TTY·키체인 없이 돈다. ubuntu-latest 러너 자체가 headless이며, 여기에
  # AIC_NO_KEYCHAIN=1(keychain fallback)을 더해 다음을 고정한다:
  #   - 헤드리스 diagnose/audit/webhook/config가 hang 없이 동작
  #   - NeedsConfirm 명령이 비대화에서 자동 실행되지 않음(보안 속성)
  #   - 관측 백엔드/webhook 통합이 mock 서버로 headless 동작
  # matrix 폭발을 피하려 단일 OS(ubuntu)에서만 돈다. PTY 테스트(#[ignore], make
  # test-pty)는 실제 터미널이 필요하므로 여기에 절대 포함하지 않는다.
  headless:
    name: headless e2e (ubuntu)
    runs-on: ubuntu-latest
    env:
      AIC_NO_KEYCHAIN: "1"

    steps:
      - uses: actions/checkout@v6

      # ubuntu 러너 디스크 고갈 방지(test 잡과 같은 이유).
      - name: Free disk space (ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          avail=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          if [ "$avail" -lt "$MIN_FREE_DISK_GB" ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          fi
          df -h /

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-headless-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-headless-
            ${{ runner.os }}-cargo-

      - name: Headless e2e + integration (no TTY, no keychain)
        run: |
          cargo test -p aic-client --test e2e_headless
          cargo test -p aic-client --test obs_tools_integration
          cargo test -p aic-server --test webhook_integration
